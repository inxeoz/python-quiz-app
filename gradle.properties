# =====================================================================
# EXTREME BUILD OPTIMISATION — 20GB / 12th Gen Intel
# =====================================================================

# 1. CORE EXECUTION
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# 2. WORKER COUNT = physical P-core threads (12th-gen hyperthreaded)
org.gradle.workers.max=16

# 3. JVM — allocate ~half of 20GB, fastest GC
org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=512m -XX:+UseZGC -XX:+ZGenerational -XX:+ParallelRefProcEnabled -Dsun.rmi.dgc.server.gcInterval=3600000 -Dsun.rmi.dgc.client.gcInterval=3600000 -XX:+AlwaysPreTouch

# 4. ANDROID
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx4g
