<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Quiz App - Profile</title>
  <style>
    :root {
      --bg:      oklch(98% 0.004 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.02 240);
      --muted:   oklch(50% 0.018 240);
      --border:  oklch(90% 0.006 240);
      --accent:  oklch(56% 0.12 170);
      --accent-muted: oklch(92% 0.04 170);

      --font-display: 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;

      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg:      oklch(14% 0.015 250);
      --surface: oklch(20% 0.012 250);
      --fg:      oklch(90% 0.005 250);
      --muted:   oklch(60% 0.01 250);
      --border:  oklch(28% 0.01 250);
      --accent:  oklch(62% 0.14 170);
      --accent-muted: oklch(25% 0.04 170);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      line-height: 1.5;
      overflow-x: hidden;
    }

    body.dark-transition,
    body.dark-transition * {
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s !important;
    }

    .app-container {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      margin-bottom: 32px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--fg);
      transition: background 0.2s, border-color 0.3s;
      flex-shrink: 0;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
      transition: background 0.2s, border-color 0.3s, color 0.2s;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .profile-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent-muted);
      display: grid;
      place-items: center;
    }

    .avatar svg {
      width: 40px;
      height: 40px;
      color: var(--accent);
    }

    .profile-name {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
    }

    .profile-email {
      font-size: 14px;
      color: var(--muted);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      width: 100%;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .profile-stat {
      text-align: center;
    }

    .profile-stat + .profile-stat {
      border-left: 1px solid var(--border);
    }

    .profile-stat-val {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
    }

    .profile-stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 32px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
    }

    @media (max-width: 430px) {
      .app-container { padding: 20px 16px; }
      header { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <a href="01-welcome.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </a>
      <span class="page-title">Profile</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </header>

    <div class="profile-card">
      <div class="avatar">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="15" r="8"/><path d="M8 44c0-8 7.2-14 16-14s16 6 16 14"/></svg>
      </div>
      <div class="profile-name">Alex Rivera</div>
      <div class="profile-email">alex.rivera@example.com</div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-val">12</div>
          <div class="profile-stat-label">Quizzes</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val">78%</div>
          <div class="profile-stat-label">Avg Score</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val">4</div>
          <div class="profile-stat-label">Streak</div>
        </div>
      </div>
    </div>

    <a href="05-flagged.html" style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 20px;text-decoration:none;color:var(--fg);box-shadow:var(--shadow);transition:background 0.3s,border-color 0.3s;margin-bottom:40px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);flex-shrink:0;"><path d="M4 21V3l12-1v14L4 17"/><path d="M16 3v14"/></svg>
        <div>
          <div style="font-weight:600;font-size:16px;">Flagged Questions</div>
          <div style="font-size:13px;color:var(--muted);margin-top:2px;"><span id="flaggedCount">0</span> questions</div>
        </div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </div>

  <nav class="bottom-nav">
    <a href="01-welcome.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v9a1 1 0 001 1h4v-6h6v6h4a1 1 0 001-1v-9"/></svg></span>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M6 16V9"/><path d="M10 16V4"/><path d="M14 16v-5"/><path d="M18 16V7"/></svg></span>
      <span>Stats</span>
    </a>
    <a href="05-flagged.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V3l12-1v14L4 17"/><path d="M16 3v14"/></svg></span>
      <span>Flagged</span>
    </a>
    <a href="04-profile.html" class="nav-item active">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    (function() {
      var FLAGGED_KEY = 'quiz-flagged-questions';
      var THEME_KEY = 'quiz-theme';

      function restoreTheme() {
        var saved;
        try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      }
      restoreTheme();

      function getFlaggedCount() {
        var raw;
        try { raw = localStorage.getItem(FLAGGED_KEY); } catch(e) { return 0; }
        try { return (JSON.parse(raw) || []).length; } catch(e) { return 0; }
      }

      var countEl = document.getElementById('flaggedCount');
      if (countEl) countEl.textContent = getFlaggedCount();

      var toggleBtn = document.getElementById('themeToggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          var html = document.documentElement;
          var isDark = html.getAttribute('data-theme') === 'dark';
          var body = document.body;
          body.classList.add('dark-transition');
          if (isDark) {
            html.removeAttribute('data-theme');
            try { localStorage.setItem(THEME_KEY, 'light'); } catch(e) {}
          } else {
            html.setAttribute('data-theme', 'dark');
            try { localStorage.setItem(THEME_KEY, 'dark'); } catch(e) {}
          }
          setTimeout(function() { body.classList.remove('dark-transition'); }, 400);
        });
      }
    })();
  </script>
</body>
</html>
