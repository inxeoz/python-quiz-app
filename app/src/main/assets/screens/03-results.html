<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Quiz App - Results</title>
  <style>
    :root {
      --bg:      oklch(98% 0.004 240);
      --surface: oklch(100% 0 0);
      --fg:      oklch(20% 0.02 240);
      --muted:   oklch(50% 0.018 240);
      --border:  oklch(90% 0.006 240);
      --accent:  oklch(56% 0.12 170);
      --accent-muted: oklch(92% 0.04 170);

      --font-display: 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;

      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;

      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg:      oklch(14% 0.015 250);
      --surface: oklch(20% 0.012 250);
      --fg:      oklch(90% 0.005 250);
      --muted:   oklch(60% 0.01 250);
      --border:  oklch(28% 0.01 250);
      --accent:  oklch(62% 0.14 170);
      --accent-muted: oklch(25% 0.04 170);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      line-height: 1.5;
      overflow-x: hidden;
    }

    body.dark-transition,
    body.dark-transition * {
      transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s !important;
    }

    .app-container {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: var(--bg);
      text-align: center;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      margin-bottom: 8px;
    }

    .header-spacer {
      width: 40px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
      transition: background 0.2s, border-color 0.3s, color 0.2s;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .results-level-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent);
      color: oklch(98% 0 0);
      margin-bottom: 16px;
    }

    .results-header {
      margin-top: 36px;
      margin-bottom: 40px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
    }

    .score-circle {
      width: 200px;
      height: 200px;
      margin: 0 auto 40px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .score-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .score-circle circle {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
    }

    .score-bg { stroke: var(--border); }
    .score-fill {
      stroke: var(--accent);
      stroke-dasharray: 565;
      stroke-dashoffset: 113;
    }

    .score-content {
      position: absolute;
      display: flex;
      flex-direction: column;
    }

    .score-val {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
    }

    .score-max {
      color: var(--muted);
      font-size: 18px;
      font-weight: 600;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .stat-val {
      font-weight: 700;
      font-size: 20px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
    }

    .footer-actions {
      margin-top: auto;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, background 0.3s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: oklch(98% 0 0);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 32px;
      z-index: 100;
      transition: background 0.3s, border-color 0.3s;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
    }

    @media (max-width: 430px) {
      .app-container { padding: 20px 16px; }
      header { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-spacer"></div>
      <span class="results-level-badge" id="levelBadge">Intermediate</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </header>

    <div class="results-header">
      <h1>Quiz Completed!</h1>
      <p class="subtitle">You did an amazing job</p>
    </div>

    <div class="score-circle">
      <svg viewBox="0 0 200 200">
        <circle class="score-bg" cx="100" cy="100" r="90" />
        <circle class="score-fill" cx="100" cy="100" r="90" />
      </svg>
      <div class="score-content">
        <span class="score-val">8</span>
        <span class="score-max">out of 10</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-val">80%</span>
        <span class="stat-label">Accuracy</span>
      </div>
      <div class="stat-card">
        <span class="stat-val">2:45</span>
        <span class="stat-label">Time</span>
      </div>
    </div>

    <div class="footer-actions">
      <a href="02-quiz-active.html" class="btn btn-primary">Try Again</a>
      <a href="01-welcome.html" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="01-welcome.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v9a1 1 0 001 1h4v-6h6v6h4a1 1 0 001-1v-9"/></svg></span>
      <span>Home</span>
    </a>
      <a href="#" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M6 16V9"/><path d="M10 16V4"/><path d="M14 16v-5"/><path d="M18 16V7"/></svg></span>
        <span>Stats</span>
      </a>
      <a href="05-flagged.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V3l12-1v14L4 17"/><path d="M16 3v14"/></svg></span>
        <span>Flagged</span>
      </a>
      <a href="04-profile.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    (function() {
      var QUIZ_LEVEL_KEY = 'quiz-selected-level';
      var THEME_KEY = 'quiz-theme';

      var levelNames = ['Basic', 'Beginner', 'Intermediate', 'Advanced', 'Expert'];

      function restoreTheme() {
        var saved;
        try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      }
      restoreTheme();

      function readSelectedLevel() {
        var idx;
        try { idx = parseInt(sessionStorage.getItem(QUIZ_LEVEL_KEY) || '2', 10); } catch(e) { idx = 2; }
        if (isNaN(idx) || idx < 0 || idx >= levelNames.length) idx = 2;
        return idx;
      }

      var levelIdx = readSelectedLevel();
      var badge = document.getElementById('levelBadge');
      if (badge) badge.textContent = levelNames[levelIdx];

      var toggleBtn = document.getElementById('themeToggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          var html = document.documentElement;
          var isDark = html.getAttribute('data-theme') === 'dark';
          var body = document.body;
          body.classList.add('dark-transition');
          if (isDark) {
            html.removeAttribute('data-theme');
            try { localStorage.setItem(THEME_KEY, 'light'); } catch(e) {}
          } else {
            html.setAttribute('data-theme', 'dark');
            try { localStorage.setItem(THEME_KEY, 'dark'); } catch(e) {}
          }
          setTimeout(function() { body.classList.remove('dark-transition'); }, 400);
        });
      }
    })();
  </script>
</body>
</html>
